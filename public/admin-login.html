<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - ETB Lottery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🔐 Admin Login</h1>

    <div class="subtitle">
      ETB Lottery Administration
    </div>

    <form id="loginForm">

      <label for="password">
        Admin Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter admin password"
        required
        autocomplete="current-password"
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>

    const form =
      document.getElementById("loginForm");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.className = "";
        message.textContent = "";

        button.disabled = true;
        button.textContent = "Logging in...";

        try {

          const response =
            await fetch(
              "/api/admin/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({
                  password:
                    password.value
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.message ||
              "Login failed."
            );
          }

          message.textContent =
            "Login successful. Opening admin panel...";

          message.className =
            "success";

          setTimeout(
            () => {
              window.location.href =
                "/admin.html";
            },
            500
          );

        } catch (error) {

          message.textContent =
            error.message;

          message.className =
            "error";

          password.value = "";

          password.focus();

        } finally {

          button.disabled = false;
          button.textContent = "Login";
        }

      }
    );

  </script>

</body>
</html>
